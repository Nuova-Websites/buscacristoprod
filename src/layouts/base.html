<!DOCTYPE html>
<!-- GENERATED FILE. Edit src/pages/{{srcPath}} (or a partial) and run `npm run build`. -->
<html lang="{{lang}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="site-root" content="{{root}}">
    <meta name="page-rel" content="{{rel}}">
    <script src="{{root}}js/lang-redirect.js"></script>
    <title>{{title}}</title>
{{#if description}}    <meta name="description" content="{{description}}">
{{/if}}{{alternates}}
    <link rel="canonical" href="{{canonical}}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Busca Cristo">
    <meta property="og:title" content="{{title}}">
{{#if description}}    <meta property="og:description" content="{{description}}">
{{/if}}    <meta property="og:url" content="{{canonical}}">
    <meta property="og:image" content="{{ogImage}}">
    <meta property="og:image:width" content="1280">
    <meta property="og:image:height" content="720">
    <meta property="og:image:alt" content="{{title}}">
    <meta property="og:locale" content="{{ogLocale}}">
{{ogLocaleAlternates}}
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="{{root}}favicon.ico" sizes="48x48">
    <link rel="icon" type="image/png" sizes="32x32" href="{{root}}img/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="{{root}}img/favicon-192.png">
    <link rel="apple-touch-icon" href="{{root}}img/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{root}}css/styles.css">
</head>
<body{{#if bodyClass}} class="{{bodyClass}}"{{/if}}>

{{> nav}}

{{content}}

{{> footer}}

{{#if jsStrings}}<script>window.T = {{jsStrings}};</script>
{{/if}}<script src="{{root}}js/site.js"></script>
{{#if script}}<script src="{{root}}{{script}}"></script>
{{/if}}</body>
</html>
